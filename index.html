<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Future • IA & Cidadania Digital</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div id="particles-js"></div>

<header class="navbar">
  <div class="logo">⚡ Digital Future</div>

  <nav>
    <a href="#home">Início</a>
    <a href="#ai">IA</a>
    <a href="#security">Segurança</a>
    <a href="#quiz">Quiz</a>
    <a href="#chat">Chat IA</a>
  </nav>
</header>

<section id="home" class="hero">
  <h1>O Futuro da <span>Educação Digital</span></h1>
  <p>Aprenda IA, segurança digital e cidadania na internet.</p>
</section>

<section id="ai" class="section glass">
  <h2>Inteligência Artificial</h2>
  <canvas id="chart"></canvas>
</section>

<section id="security" class="section">
  <h2>Segurança Digital</h2>
  <p>Proteja seus dados e evite golpes online.</p>
</section>

<section id="quiz" class="section glass">
  <h2>Quiz Interativo</h2>

  <p id="question"></p>
  <div id="answers"></div>

  <button id="next">Próxima</button>

  <p>Pontos: <span id="score">0</span></p>
</section>

<section id="chat" class="section">
  <h2>Assistente IA</h2>

  <div id="chatBox"></div>

  <input id="input" placeholder="Digite sua pergunta...">
  <button onclick="send()">Enviar</button>
</section>

<button id="top">⬆</button>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script src="script.js"></script>

</body>
</html>
