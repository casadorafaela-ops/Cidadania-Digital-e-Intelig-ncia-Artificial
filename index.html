<!-- PROGRESSO DO USUÁRIO -->
<section class="section dark">
  <h2>Seu Progresso Digital</h2>

  <div class="card">
    <p>Você está aprendendo cidadania digital e IA</p>

    <div class="progress-bar">
      <div id="progress"></div>
    </div>

    <button onclick="increaseProgress()">Avançar Progresso</button>

    <p id="badge"></p>
  </div>
</section>

<!-- CERTIFICADO -->
<section class="section">
  <h2>Certificado Digital</h2>

  <div class="card">
    <p>Gere seu certificado após aprender</p>
    <button onclick="generateCertificate()">Gerar Certificado</button>

    <p id="certificate"></p>
  </div>
</section>

<!-- CURIOSIDADES -->
<section class="section dark">
  <h2>Curiosidades de IA</h2>

  <div class="card">
    <p id="fact">Clique para descobrir algo novo</p>
    <button onclick="newFact()">Nova curiosidade</button>
  </div>
</section>
